name: 'Docker Build Hytale'
description: 'Build, test and optionally push Hytale Docker image'

inputs:
  push:
    description: 'Push the image to registries'
    required: false
    default: 'false'
  platforms:
    description: 'Target platforms'
    required: false
    default: 'linux/amd64'
  tags:
    description: 'Docker tags (newline separated)'
    required: true
  dockerhub-username:
    description: 'Docker Hub username'
    required: false
  dockerhub-token:
    description: 'Docker Hub token'
    required: false
  github-token:
    description: 'GitHub token for GHCR'
    required: false

outputs:
  image-digest:
    description: 'Image digest'
    value: ${{ steps.build.outputs.digest }}
  image-metadata:
    description: 'Image metadata'
    value: ${{ steps.meta.outputs.json }}

runs:
  using: 'composite'
  steps:
    # ─── QEMU pour multi-arch ───
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
      if: contains(inputs.platforms, 'arm64')

    # ─── Buildx ───
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        driver-opts: |
          image=moby/buildkit:v0.14.1
          network=host

    # ─── Login Docker Hub ───
    - name: Login to Docker Hub
      if: inputs.push == 'true' && inputs.dockerhub-username != ''
      uses: docker/login-action@v3
      with:
        username: ${{ inputs.dockerhub-username }}
        password: ${{ inputs.dockerhub-token }}

    # ─── Login GHCR ───
    - name: Login to GitHub Container Registry
      if: inputs.push == 'true' && inputs.github-token != ''
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ inputs.github-token }}

    # ─── Metadata / Tags ───
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: |
          ${{ inputs.dockerhub-username }}/hytale-server
          ghcr.io/${{ github.repository }}
        tags: ${{ inputs.tags }}
        labels: |
          org.opencontainers.image.title=Hytale Docker Server
          org.opencontainers.image.description=Secure and optimized Docker image for Hytale game servers
          org.opencontainers.image.vendor=${{ github.repository_owner }}
          io.artifacthub.package.category=game-servers
          io.artifacthub.package.keywords=hytale,game-server,docker,java

    # ─── Build & Push ───
    - name: Build and push
      id: build
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        platforms: ${{ inputs.platforms }}
        push: ${{ inputs.push }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        provenance: true
        sbom: true
        build-args: |
          BUILD_DATE=${{ github.event.head_commit.timestamp }}
          VCS_REF=${{ github.sha }}
          VERSION=${{ steps.meta.outputs.version }}
