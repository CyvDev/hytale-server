name: 🚀 Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  DOCKERHUB_REPO: tonuser/hytale-server

jobs:

  # ════════════════════════════════════════════════
  # JOB 1 : Validation du tag
  # ════════════════════════════════════════════════
  validate:
    name: ✅ Validate Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      major: ${{ steps.version.outputs.major }}
      minor: ${{ steps.version.outputs.minor }}
      patch: ${{ steps.version.outputs.patch }}
      is-prerelease: ${{ steps.version.outputs.is-prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          
          # Parse semver
          MAJOR=$(echo "$TAG" | cut -d. -f1)
          MINOR=$(echo "$TAG" | cut -d. -f2)
          PATCH=$(echo "$TAG" | cut -d. -f3 | cut -d- -f1)
          
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "minor=$MINOR" >> "$GITHUB_OUTPUT"
          echo "patch=$PATCH" >> "$GITHUB_OUTPUT"
          
          # Détection pre-release (ex: v1.0.0-rc.1)
          if echo "$TAG" | grep -qE '[-]'; then
            echo "is-prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          
          echo "📦 Version: $TAG (major=$MAJOR, minor=$MINOR, patch=$PATCH)"

      - name: Validate CHANGELOG
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if ! grep -q "## \[${VERSION}\]" CHANGELOG.md 2>/dev/null && \
             ! grep -q "## ${VERSION}" CHANGELOG.md 2>/dev/null; then
            echo "::warning::No CHANGELOG entry found for version ${VERSION}"
          fi

  # ════════════════════════════════════════════════
  # JOB 2 : Build multi-arch + Push
  # ════════════════════════════════════════════════
  build-and-push:
    name: 🏗️ Build & Push
    runs-on: ubuntu-latest
    needs: validate
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_REPO }}
            ghcr.io/${{ github.repository }}
          tags: |
            # v1.2.3
            type=semver,pattern={{version}}
            # v1.2
            type=semver,pattern={{major}}.{{minor}}
            # v1
            type=semver,pattern={{major}}
            # latest (seulement si pas pre-release)
            type=raw,value=latest,enable=${{ needs.validate.outputs.is-prerelease == 'false' }}
          labels: |
            org.opencontainers.image.title=Hytale Docker Server
            org.opencontainers.image.description=Secure and optimized Docker image for Hytale game servers
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ needs.validate.outputs.version }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # ════════════════════════════════════════════════
  # JOB 3 : Tests post-push (smoke test)
  # ════════════════════════════════════════════════
  smoke-test:
    name: 💨 Smoke Test
    runs-on: ubuntu-latest
    needs: [validate, build-and-push]
    steps:
      - uses: actions/checkout@v4

      - name: Pull and test published image
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          IMAGE="${{ env.DOCKERHUB_REPO }}:${VERSION}"
          
          echo "📥 Pulling $IMAGE..."
          docker pull "$IMAGE"
          
          echo ""
          echo "📋 Image info:"
          docker inspect "$IMAGE" --format='
            Size: {{.Size}}
            Created: {{.Created}}
            Arch: {{.Architecture}}
            OS: {{.Os}}
          '
          
          echo ""
          echo "☕ Testing Java version..."
          docker run --rm "$IMAGE" java -version
          
          echo ""
          echo "🔒 Testing non-root..."
          USER=$(docker run --rm "$IMAGE" id -u)
          if [ "$USER" = "0" ]; then
            echo "❌ Running as root!"
            exit 1
          fi
          echo "✅ Running as UID $USER"
          
          echo ""
          echo "✅ Smoke test passed for $IMAGE"

  # ════════════════════════════════════════════════
  # JOB 4 : Créer la Release GitHub
  # ════════════════════════════════════════════════
  github-release:
    name: 📋 GitHub Release
    runs-on: ubuntu-latest
    needs: [validate, build-and-push, smoke-test]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          DIGEST="${{ needs.build-and-push.outputs.digest }}"
          
          cat << EOF > /tmp/release-notes.md
          ## 🎮 Hytale Docker Server v${VERSION}
          
          ### 🐳 Docker Pull
          
          \`\`\`bash
          # Docker Hub
          docker pull ${{ env.DOCKERHUB_REPO }}:${VERSION}
          
          # GitHub Container Registry
          docker pull ghcr.io/${{ github.repository }}:${VERSION}
          \`\`\`
          
          ### 🔐 Image Verification
          
          \`\`\`bash
          # Verify digest
          docker pull ${{ env.DOCKERHUB_REPO }}:${VERSION}@${DIGEST}
          \`\`\`
          
          **Image Digest:** \`${DIGEST}\`
          
          ### 📦 Supported Architectures
          
          | Architecture | Support |
          |---|---|
          | linux/amd64 | ✅ |
          | linux/arm64 | ✅ |
          
          ### 📝 Changes
          
          $(git log $(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "HEAD~10")..HEAD \
            --pretty=format:"- %s (%h)" --no-merges 2>/dev/null || echo "- Initial release")
          
          ---
          
          **Full Changelog**: https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "v${{ needs.validate.outputs.version }}"
          body_path: /tmp/release-notes.md
          draft: false
          prerelease: ${{ needs.validate.outputs.is-prerelease == 'true' }}
          generate_release_notes: false

  # ════════════════════════════════════════════════
  # JOB 5 : Notification Discord
  # ════════════════════════════════════════════════
  notify:
    name: 📢 Notify
    runs-on: ubuntu-latest
    needs: [validate, github-release]
    if: needs.validate.outputs.is-prerelease == 'false'
    steps:
      - name: Discord notification
        uses: sarisia/actions-status-discord@v1
        if: ${{ secrets.DISCORD_WEBHOOK_URL != '' }}
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          nodetail: true
          title: "🎮 Hytale Docker Server v${{ needs.validate.outputs.version }} Released!"
          description: |
            New version is available!
            
            ```
            docker pull ${{ env.DOCKERHUB_REPO }}:${{ needs.validate.outputs.version }}
            ```
            
            📋 [Release Notes](https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }})
          color: 0x5865F2
