name: 🌙 Nightly Build

on:
  schedule:
    # Tous les jours à 3h00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

env:
  DOCKERHUB_REPO: tonuser/hytale-server

jobs:
  nightly:
    name: 🌙 Nightly Build & Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push nightly
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKERHUB_REPO }}:nightly
            ${{ env.DOCKERHUB_REPO }}:nightly-${{ github.run_number }}
            ghcr.io/${{ github.repository }}:nightly
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Trivy scan nightly
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKERHUB_REPO }}:nightly
          format: 'sarif'
          output: 'trivy-nightly.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-nightly.sarif
          category: trivy-nightly
