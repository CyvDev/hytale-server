name: 🔄 CI Pipeline

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'

# Un seul workflow par PR à la fois
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  security-events: write
  actions: read

env:
  DOCKERHUB_REPO: tonuser/hytale-server
  TEST_TAG: hytale-server:test-${{ github.sha }}

jobs:

  # ════════════════════════════════════════════════
  # JOB 1 : Lint & Validation
  # ════════════════════════════════════════════════
  lint:
    name: 🔍 Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
          format: sarif
          output-file: hadolint-results.sarif

      - name: Upload Hadolint SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: hadolint-results.sarif
          category: hadolint

      - name: Lint shell scripts
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './scripts'
          severity: warning

      - name: Validate docker-compose
        run: docker compose -f docker-compose.yml config --quiet

      - name: Check YAML syntax
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .
          config_data: |
            extends: default
            rules:
              line-length:
                max: 200
              truthy:
                check-keys: false

  # ════════════════════════════════════════════════
  # JOB 2 : Build de l'image (test, pas de push)
  # ════════════════════════════════════════════════
  build:
    name: 🏗️ Build Image
    runs-on: ubuntu-latest
    needs: lint
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (local)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ env.TEST_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}

      - name: Inspect image
        run: |
          echo "📦 Image size:"
          docker images ${{ env.TEST_TAG }} --format "{{.Size}}"
          
          echo ""
          echo "📋 Image layers:"
          docker history ${{ env.TEST_TAG }} --no-trunc --format "table {{.CreatedBy}}\t{{.Size}}"
          
          echo ""
          echo "🏷️ Image labels:"
          docker inspect ${{ env.TEST_TAG }} --format='{{json .Config.Labels}}' | jq .

      - name: Export image for other jobs
        run: |
          docker save ${{ env.TEST_TAG }} | gzip > /tmp/hytale-image.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/hytale-image.tar.gz
          retention-days: 1

  # ════════════════════════════════════════════════
  # JOB 3 : Tests de structure du container
  # ════════════════════════════════════════════════
  structure-test:
    name: 🧪 Structure Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load image
        run: |
          docker load < /tmp/hytale-image.tar.gz

      - name: Install container-structure-test
        run: |
          curl -LO https://github.com/GoogleContainerTools/container-structure-test/releases/latest/download/container-structure-test-linux-amd64
          chmod +x container-structure-test-linux-amd64
          sudo mv container-structure-test-linux-amd64 /usr/local/bin/container-structure-test

      - name: Run structure tests
        run: |
          container-structure-test test \
            --image ${{ env.TEST_TAG }} \
            --config tests/container-structure-test.yml

      - name: Run entrypoint tests
        run: |
          chmod +x tests/test-entrypoint.sh
          bash tests/test-entrypoint.sh ${{ env.TEST_TAG }}

      - name: Run JVM tests
        run: |
          chmod +x tests/test-jvm.sh
          bash tests/test-jvm.sh ${{ env.TEST_TAG }}

  # ════════════════════════════════════════════════
  # JOB 4 : Tests de sécurité runtime
  # ════════════════════════════════════════════════
  security-runtime-test:
    name: 🔐 Security Runtime Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load image
        run: docker load < /tmp/hytale-image.tar.gz

      - name: Test — Runs as non-root
        run: |
          USER=$(docker run --rm ${{ env.TEST_TAG }} whoami 2>/dev/null || \
                 docker run --rm ${{ env.TEST_TAG }} id -u)
          echo "Container user: $USER"
          if [ "$USER" = "root" ] || [ "$USER" = "0" ]; then
            echo "❌ FAIL: Container runs as root!"
            exit 1
          fi
          echo "✅ PASS: Container runs as non-root ($USER)"

      - name: Test — No shell escalation possible
        run: |
          # Vérifie que su/sudo ne sont pas disponibles
          if docker run --rm ${{ env.TEST_TAG }} which sudo 2>/dev/null; then
            echo "❌ FAIL: sudo is available in the container"
            exit 1
          fi
          echo "✅ PASS: No sudo available"
          
          if docker run --rm ${{ env.TEST_TAG }} which su 2>/dev/null; then
            echo "❌ FAIL: su is available in the container"
            exit 1
          fi
          echo "✅ PASS: No su available"

      - name: Test — Read-only filesystem works
        run: |
          # Le container doit fonctionner avec --read-only
          docker run --rm --read-only \
            --tmpfs /tmp:rw,noexec,nosuid \
            --tmpfs /opt/hytale/tmp:rw,noexec,nosuid \
            ${{ env.TEST_TAG }} \
            sh -c "echo 'read-only test OK'" && \
          echo "✅ PASS: Container works with read-only filesystem" || \
          echo "⚠️ WARN: Container may have issues with read-only filesystem"

      - name: Test — No unnecessary ports exposed
        run: |
          PORTS=$(docker inspect ${{ env.TEST_TAG }} --format='{{json .Config.ExposedPorts}}')
          echo "Exposed ports: $PORTS"
          # Vérifier qu'on n'expose que le port du serveur
          PORT_COUNT=$(echo "$PORTS" | jq 'length')
          if [ "$PORT_COUNT" -gt 2 ]; then
            echo "⚠️ WARN: More than 2 ports exposed ($PORT_COUNT)"
          fi
          echo "✅ PASS: Port configuration looks correct"

      - name: Test — No secrets or credentials in image
        run: |
          echo "Checking for leaked credentials..."
          
          # Exporter le filesystem de l'image
          CONTAINER_ID=$(docker create ${{ env.TEST_TAG }})
          docker export $CONTAINER_ID > /tmp/container-fs.tar
          docker rm $CONTAINER_ID
          
          # Chercher des patterns sensibles
          PATTERNS="password|secret|api_key|private_key|AWS_SECRET|BEGIN RSA|BEGIN PRIVATE"
          
          FOUND=$(tar -tf /tmp/container-fs.tar | head -500 | while read f; do
            # Ne vérifier que les fichiers de config, pas les binaires
            case "$f" in
              *.conf|*.cfg|*.properties|*.yml|*.yaml|*.env|*.json|*.xml|*.txt|*.sh)
                tar -xf /tmp/container-fs.tar "$f" -O 2>/dev/null | \
                  grep -iE "$PATTERNS" | head -5
                ;;
            esac
          done)
          
          if [ -n "$FOUND" ]; then
            echo "⚠️ WARN: Potential credentials found in image:"
            echo "$FOUND"
          else
            echo "✅ PASS: No obvious credentials found"
          fi

      - name: Test — Healthcheck is defined
        run: |
          HC=$(docker inspect ${{ env.TEST_TAG }} --format='{{json .Config.Healthcheck}}')
          if [ "$HC" = "null" ] || [ -z "$HC" ]; then
            echo "❌ FAIL: No HEALTHCHECK defined"
            exit 1
          fi
          echo "✅ PASS: HEALTHCHECK is defined: $HC"

  # ════════════════════════════════════════════════
  # JOB 5 : Scan de vulnérabilités (Trivy)
  # ════════════════════════════════════════════════
  vulnerability-scan:
    name: 🛡️ Vulnerability Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load image
        run: docker load < /tmp/hytale-image.tar.gz

      # ─── Trivy — Scan complet ───
      - name: Trivy vulnerability scan (table)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.TEST_TAG }}
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'

      - name: Trivy vulnerability scan (SARIF)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.TEST_TAG }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      # ─── Trivy — Fail on CRITICAL ───
      - name: Trivy scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.TEST_TAG }}
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '1'

      # ─── Trivy — SBOM ───
      - name: Generate SBOM
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.TEST_TAG }}
          format: 'cyclonedx'
          output: 'sbom.cdx.json'

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90

      # ─── Grype — Second scanner (défense en profondeur) ───
      - name: Grype vulnerability scan
        uses: anchore/scan-action@v4
        id: grype
        with:
          image: ${{ env.TEST_TAG }}
          fail-build: false
          severity-cutoff: critical

      - name: Upload Grype SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype

  # ════════════════════════════════════════════════
  # JOB 6 : Analyse statique Dockerfile (Dockle)
  # ════════════════════════════════════════════════
  dockle-scan:
    name: 🔎 Dockle Best Practices
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load image
        run: docker load < /tmp/hytale-image.tar.gz

      - name: Run Dockle
        uses: erzz/dockle-action@v1
        with:
          image: ${{ env.TEST_TAG }}
          failure-threshold: WARN
          accept-keywords: |
            gpg
            apk
            key

  # ════════════════════════════════════════════════
  # JOB 7 : Push vers GHCR + Docker Hub (main only)
  # ════════════════════════════════════════════════
  push:
    name: 📦 Push Image
    runs-on: ubuntu-latest
    needs:
      - structure-test
      - security-runtime-test
      - vulnerability-scan
      - dockle-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/docker-build
        with:
          push: 'true'
          platforms: 'linux/amd64,linux/arm64'
          tags: |
            type=raw,value=latest
            type=sha,prefix=
            type=raw,value={{date 'YYYYMMDD'}}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_REPO }}
          readme-filepath: ./DOCKER_HUB_README.md
          short-description: >
            🎮 Secure & optimized Docker image for Hytale servers. 
            Java 25, Alpine Linux, rootless, hardened.

  # ════════════════════════════════════════════════
  # JOB 8 : Résumé dans la PR
  # ════════════════════════════════════════════════
  pr-summary:
    name: 📝 PR Summary
    runs-on: ubuntu-latest
    needs:
      - structure-test
      - security-runtime-test
      - vulnerability-scan
      - dockle-scan
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load image
        run: docker load < /tmp/hytale-image.tar.gz

      - name: Generate summary
        id: summary
        run: |
          SIZE=$(docker images ${{ env.TEST_TAG }} --format "{{.Size}}")
          LAYERS=$(docker history ${{ env.TEST_TAG }} --quiet | wc -l)
          
          cat << 'SUMMARY' > /tmp/pr-comment.md
          ## 🐳 Docker Image Build Report
          
          | Metric | Value |
          |--------|-------|
          | 📦 Image Size | `SIZE_PLACEHOLDER` |
          | 📚 Layers | `LAYERS_PLACEHOLDER` |
          | 🏷️ Test Tag | `${{ env.TEST_TAG }}` |
          | 🖥️ Platform | `linux/amd64` |
          
          ### ✅ Checks Passed
          - 🔍 Hadolint (Dockerfile lint)
          - 🧪 Container structure tests
          - 🔐 Security runtime tests
          - 🛡️ Trivy vulnerability scan
          - 🛡️ Grype vulnerability scan
          - 🔎 Dockle best practices
          SUMMARY
          
          sed -i "s/SIZE_PLACEHOLDER/$SIZE/" /tmp/pr-comment.md
          sed -i "s/LAYERS_PLACEHOLDER/$LAYERS/" /tmp/pr-comment.md

      - name: Post PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: /tmp/pr-comment.md
