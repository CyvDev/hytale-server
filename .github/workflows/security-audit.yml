name: 🔒 Weekly Security Audit

on:
  schedule:
    # Tous les lundis à 8h00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  issues: write

jobs:
  full-audit:
    name: 🔒 Full Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull latest image
        run: docker pull ${{ vars.DOCKERHUB_REPO || 'tonuser/hytale-server' }}:latest
        continue-on-error: true

      - name: Trivy — Full scan (all severities)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'tonuser/hytale-server:latest'
          format: 'json'
          output: 'trivy-full.json'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'
        continue-on-error: true

      - name: Trivy — SARIF for Security tab
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'tonuser/hytale-server:latest'
          format: 'sarif'
          output: 'trivy-audit.sarif'
        continue-on-error: true

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-audit.sarif
          category: weekly-audit
        continue-on-error: true

      - name: Trivy — License scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'tonuser/hytale-server:latest'
          scanners: 'license'
          format: 'table'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: Generate audit report
        if: always()
        run: |
          echo "## 🔒 Weekly Security Audit Report" > /tmp/audit.md
          echo "" >> /tmp/audit.md
          echo "**Date:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> /tmp/audit.md
          echo "**Image:** tonuser/hytale-server:latest" >> /tmp/audit.md
          echo "" >> /tmp/audit.md
          
          if [ -f trivy-full.json ]; then
            CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-full.json 2>/dev/null || echo "N/A")
            HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' trivy-full.json 2>/dev/null || echo "N/A")
            MEDIUM=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="MEDIUM")] | length' trivy-full.json 2>/dev/null || echo "N/A")
            LOW=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="LOW")] | length' trivy-full.json 2>/dev/null || echo "N/A")
            
            echo "| Severity | Count |" >> /tmp/audit.md
            echo "|----------|-------|" >> /tmp/audit.md
            echo "| 🔴 Critical | $CRITICAL |" >> /tmp/audit.md
            echo "| 🟠 High | $HIGH |" >> /tmp/audit.md
            echo "| 🟡 Medium | $MEDIUM |" >> /tmp/audit.md
            echo "| 🔵 Low | $LOW |" >> /tmp/audit.md
          fi

      - name: Create issue if critical vulnerabilities
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let critical = 0;
            
            try {
              const data = JSON.parse(fs.readFileSync('trivy-full.json', 'utf8'));
              for (const result of (data.Results || [])) {
                for (const vuln of (result.Vulnerabilities || [])) {
                  if (vuln.Severity === 'CRITICAL') critical++;
                }
              }
            } catch(e) {
              console.log('Could not parse scan results:', e.message);
              return;
            }
            
            if (critical > 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🚨 Security Alert: ${critical} CRITICAL vulnerabilities found`,
                body: `The weekly security audit found **${critical} CRITICAL** vulnerabilities.\n\nPlease review the [Security tab](https://github.com/${context.repo.owner}/${context.repo.repo}/security/code-scanning) for details.\n\n_This issue was automatically created by the weekly security audit._`,
                labels: ['security', 'critical', 'automated']
              });
            }
